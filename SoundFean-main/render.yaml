services:
  - type: web
    name: soundfean-backend
    runtime: python
    rootDir: SoundFean-main/backend
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT

  - type: web
    name: soundfean-frontend
    runtime: static
    rootDir: SoundFean-main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
